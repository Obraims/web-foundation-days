<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - User Directory & API Design</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #222222;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        main {
            max-width: 700px;
            margin: 20px auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
            color: #1e3c72;
            font-size: 1.6rem;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }
        button {
            background-color: #0ba184;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover:not(:disabled) {
            background-color: #088a70;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        #status {
            font-weight: 600;
            color: #444444;
            margin: 12px 0;
        }
        ul#users-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul#users-list li {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .user-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .user-info {
            font-size: 0.95rem;
            color: #475569;
        }
    </style>
    <script src="users.js" defer></script>
</head>
<body>
    <main>
        <h1>User Directory</h1>
        <div class="controls">
            <button id="load-users" type="button">Load Users</button>
            <label for="filter-input">Filter by name:</label>
            <input type="text" id="filter-input" placeholder="Filter by name...">
        </div>

        <p id="status"></p>

        <ul id="users-list"></ul>
    </main>
</body>
</html>
